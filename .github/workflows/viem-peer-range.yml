name: viem peer range

# The client's peer range is `viem >=2.28.0 <3`, but CI otherwise runs only the
# locked viem. The adapters' replacement checks depend on viem internals that
# differ across that range (when `onReplaced` fires, how `dataSuffix` is
# appended), so this runs the client suite against real releases of it.
on:
  pull_request:
    paths:
      - 'packages/client/src/lib/viemReceipt*'
      - 'packages/client/src/viem*'
      - 'packages/client/src/privy*'
      - 'packages/client/src/eip5792*'
      - '.github/workflows/viem-peer-range.yml'
  schedule:
    # Weekly, for viem releases published since the lockfile was last bumped.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  client-tests:
    name: Client tests (viem ${{ matrix.viem }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor, the first release with `dataSuffix`, the last release that
        # stays silent with several confirmations, and the newest release.
        # A scheduled run tests only the newest release.
        viem: ${{ github.event_name == 'schedule' && fromJSON('["latest"]') || fromJSON('["2.28.0", "2.45.0", "2.57.11", "latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Changes package.json and the lockfile in the runner only; nothing is
      # committed. `latest` resolves within the workspace's `minimumReleaseAge`.
      - name: Install viem ${{ matrix.viem }} for the client
        env:
          VIEM_VERSION: ${{ matrix.viem }}
        run: pnpm --filter @osero/client add -D "viem@${VIEM_VERSION}"

      - name: Show the viem the client resolves
        run: node -p "require('./packages/client/node_modules/viem/package.json').version"

      - name: Test the client
        run: pnpm --filter @osero/client test
